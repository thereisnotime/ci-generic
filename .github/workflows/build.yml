name: build

on:
  push:
    branches: [main]
    # README.md is deliberately absent: this workflow commits it back, and
    # including it here would make every build trigger another build.
    paths:
      - 'Dockerfile'
      - 'versions.env'
      - 'build.sh'
      - '.github/workflows/build.yml'
      - '.github/scripts/render-readme.py'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'versions.env'
      - 'build.sh'
      - '.github/workflows/build.yml'
      - '.github/scripts/render-readme.py'
  schedule:
    # Weekly rebuild picks up base-image security updates even when nothing in
    # the repo changed.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub-hosted on purpose: this is the image the self-hosted runners use,
    # so building it on them would be circular.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # versions.env is the single source of truth; turn it into build-args so
      # the Dockerfile's argument-less ARGs resolve.
      - id: versions
        run: |
          {
            echo 'args<<__EOF__'
            grep -E '^[A-Z_]+_VERSION=' versions.env
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.versions.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Compressed size, summed from the manifest: this is what a node actually
      # downloads, unlike `docker images`, which reports the extracted size.
      - id: size
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${{ github.repository }}:pull&service=ghcr.io" | jq -r .token)
          manifest=$(curl -fsSL -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${{ github.repository }}/manifests/${{ steps.push.outputs.digest }}")
          bytes=$(echo "$manifest" | jq '[.layers[].size] | add')
          echo "size=$(numfmt --to=iec --suffix=B --format='%.2f' "$bytes")" >> "$GITHUB_OUTPUT"

      - name: Refresh README
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          IMAGE_SIZE: ${{ steps.size.outputs.size }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          python3 .github/scripts/render-readme.py
          if git diff --quiet -- README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit \
            -m "docs: refresh image size and versions" \
            -m "Generated by the build workflow from versions.env."
          # Rebase in case something landed while the image was building.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
